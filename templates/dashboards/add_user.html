{% extends 'base.html'%}


{%block content%}
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboards/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9">
        {% if perms.auth.view_users %}
        <h2>Add New User</h2>
        <form action="{% url 'add_user' %}" method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Add</button>
        </form>
        <br>
        {% else%}
        {% include '404.html' %}
        {% endif %}
    </div>
</div>
{% endblock %}
