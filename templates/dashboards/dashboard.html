{% extends 'base.html' %}

{% block content %}

<div class="container-fluid p-0 mt-4">
    <div class="row">
        <!-- Dashboard Sidebar -->
        {% include 'dashboards/sidebar.html' %}

        <!-- Main Panel Content -->
        <div class="col-lg-9 col-md-8 col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="font-weight-bold mb-0" style="font-size: 1.75rem;">Dashboard Overview</h2>
                <span class="text-muted" style="font-size: 0.9rem;">Logged in as: <strong>{{ user }}</strong></span>
            </div>
            
            <div class="row">
                <!-- Statistics Card: Categories -->
                <div class="col-md-6 col-12 mb-3">
                    <div class="hallway-dashboard-card text-center">
                        <h3 class="hallway-dashboard-card-title">All Categories</h3>
                        <p class="hallway-dashboard-card-val">{{ category_count }}</p>
                    </div>
                </div>

                <!-- Statistics Card: Posts -->
                <div class="col-md-6 col-12 mb-3">
                    <div class="hallway-dashboard-card text-center">
                        <h3 class="hallway-dashboard-card-title">All Posts</h3>
                        <p class="hallway-dashboard-card-val">{{ blogs_count }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
