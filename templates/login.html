{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<h3 class="text-center">Login</h3>

<form action="{% url 'login' %}" method="POST" style="width:500px; margin:auto;">
    {% csrf_token %}
    {{ form | crispy }}
    <div class="text-center mt-4 mb-3">
    <button type="submit" class="btn btn-warning px-5 py-2">
        LogIn
    </button>
</div>
</form>
{% endblock %}
