{% extends 'base.html' %}

{% block content %}
    <!-- Categorical Posts -->
    <h3 class="text-uppercase text-warning"
        style="letter-spacing: 2px;">
        {{category}}
    </h3>

    <div class="row mb-2">

        {% for post in posts %}

            <div class="col-md-6">

                <div class="card border-0">

                    <div class="card-body">

                        <h3>
                            <a href="{% url 'blogs' post.slug %}" class="text-dark">{{ post.title }}</a>
                        </h3>

                        <small class="mb-1 text-muted">
                            {{ post.updated_at|timesince }} ago |
                            {{ post.author }}
                        </small>

                        <p class="card-text">
                            {{ post.short_description|truncatewords:25 }}
                        </p>

                    </div>

                </div>

            </div>

        {% empty %}

            <p>No posts found</p>

        {% endfor %}

    </div>

</div>
{% endblock %}
