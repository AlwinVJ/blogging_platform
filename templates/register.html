{% extends 'base.html' %}


{% block content %}
{% load crispy_forms_tags %}

<h3 class="text-center">Register</h3>
<form action="{% url 'register' %}" method="POST" style="width:800px; margin:auto;">
    {% csrf_token %}
    {{ form | crispy }}
    <div class="text-center mt-4 mb-3">
    <button type="submit" class="btn btn-warning px-5 py-2">
        Submit
    </button>
</div>
</form>
{% endblock %}
